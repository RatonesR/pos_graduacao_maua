services:
  minio:
    image: bitnamilegacy/minio:latest
    container_name: ecommerce_minio
    user: "0"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lakehouse_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lakehouse_secret_2026}
      MINIO_DEFAULT_BUCKETS: "bronze,silver,gold,warehouse"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_pass}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: ecommerce_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_pass}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    command: bash -c "airflow db migrate"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: ecommerce_airflow_webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - ../.env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_pass}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../scripts:/opt/airflow/scripts
      - ../dbt_project:/opt/airflow/dbt_project
      - lakehouse_catalog:/opt/airflow/data
    command: airflow webserver --port 8080

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.full
    container_name: ecommerce_airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    env_file:
      - ../.env.example
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_pass}@postgres:5432/${POSTGRES_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../scripts:/opt/airflow/scripts
      - ../dbt_project:/opt/airflow/dbt_project
      - lakehouse_catalog:/opt/airflow/data
    command: airflow scheduler

volumes:
  minio_data:
  postgres_data:
  lakehouse_catalog: