ecommerce_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: '/opt/airflow/data/lakehouse.duckdb'
      extensions:
        - httpfs
        - parquet
      settings:
        s3_endpoint: 'minio:9000'
        s3_access_key_id: 'lakehouse_admin'
        s3_secret_access_key: 'lakehouse_secret_2026'
        s3_region: 'us-east-1'
        s3_url_style: 'path'
        s3_use_ssl: false